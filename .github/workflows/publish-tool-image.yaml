name: Publish tool image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push tool image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image coordinates
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "TOOL_IMAGE=ghcr.io/${owner}/milvus-operator-tools:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tool image
        run: docker build -f tool.Dockerfile -t "${TOOL_IMAGE}" .

      - name: Push tool image
        run: docker push "${TOOL_IMAGE}"
